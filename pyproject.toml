[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "occamroute"
version = "0.1.0"
description = "AST code-graph context compression and calibrated PyTorch/Scikit-learn LLM complexity routing for AI coding agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Maykon Lincoln" }]
keywords = [
  "llm-routing",
  "ast-code-graph",
  "context-engineering",
  "lost-in-the-middle",
  "repograph",
  "routellm",
  "ai-coding-agents",
  "swe-bench",
  "finops",
  "pytorch",
  "scikit-learn",
  "networkx",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Code Generators",
]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "tiktoken>=0.7",
  "datasets>=2.19",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "torch>=2.3",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "scipy>=1.12",
]

[project.urls]
Homepage = "https://github.com/maykonlincolnusa/OccamRoute-Surgical-Context-Complexity-Routing-Engine-"
Repository = "https://github.com/maykonlincolnusa/OccamRoute-Surgical-Context-Complexity-Routing-Engine-"
Issues = "https://github.com/maykonlincolnusa/OccamRoute-Surgical-Context-Complexity-Routing-Engine-/issues"

[project.scripts]
occamroute = "occamroute.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/occamroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
