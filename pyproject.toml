[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "occamroute"
version = "0.1.0"
description = "Structural AST code graph slicing and adaptive cost-quality LLM routing."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "tiktoken>=0.7",
  "datasets>=2.19",
  "pandas>=2.2",
  "scikit-learn>=1.5",
  "joblib>=1.4",
  "torch>=2.3",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "uvicorn>=0.30",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "scipy>=1.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/occamroute"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
